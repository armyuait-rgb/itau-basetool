name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    name: stability / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run stability smoke
        run: python scripts/smoke/runner-stability-smoke.py --duration 60

      - name: Run pip-audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --format=json | tee audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("audit.json").read_text(encoding="utf-8").strip()
          findings = json.loads(raw or "[]")
          if findings:
              print(f"pip-audit reported {len(findings)} finding(s)")
              raise SystemExit(1)
          PY
